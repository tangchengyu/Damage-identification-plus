name: Model regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-regressions:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-runtime.txt
      - run: python -m unittest scripts.test_model_regressions scripts.test_audit_dataset -v
